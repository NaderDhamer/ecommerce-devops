services:

  mongodb:
    image: mongo:7
    container_name: mongodb

    restart: always

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

  backend:
    build: ./backend

    container_name: backend

    restart: always

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    environment:
      - MONGO_URI=mongodb://mongodb:27017/ecommerce

  frontend:
    build: ./frontend

    container_name: frontend

    restart: always

    depends_on:
      - backend

  nginx:
    image: nginx:stable-alpine

    container_name: nginx

    restart: always

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf

    depends_on:
      - frontend
      - backend

volumes:
  mongodb_data: